name: enterprise-ai-platform

services:
  # ── PostgreSQL + pgvector ──────────────────────────────────
  # One database serves three jobs: business tables (SQL tool),
  # document chunks + embeddings (retrieval tool), and the audit log.
  # See docs/decisions.md ADR-001 for why not a separate vector DB.
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_ai}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_local_only}
    ports:
      # Host 5433 — 5432 and 5546 are already taken by other local labs.
      - "127.0.0.1:5433:5432"
    volumes:
      # Named volume, not a bind mount: Postgres data files stay inside the
      # Linux VM, so DB I/O is not slowed down by the Windows filesystem.
      - db-data:/var/lib/postgresql/data
      # sql/ is mounted read-only so schema files can be applied with psql
      # without rebuilding anything.
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-enterprise_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - platform

  # ── API ────────────────────────────────────────────────────
  # For day-to-day development run uvicorn on the host instead
  # (uv run uvicorn src.api:app --reload --port 8010) and keep only `db` up.
  # This service exists so the whole system starts with one command for the demo.
  # `prometheus` scrapes this container over the compose network (api:8010), so
  # if you run uvicorn on the host instead, point docker/prometheus/prometheus.yml
  # at host.docker.internal:8010 to keep metrics flowing.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: enterprise-ai-api:local
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      # Inside the compose network the DB is reachable by service name on 5432.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_ai}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_local_only}
      LLM_PROVIDER: ${LLM_PROVIDER:-unset}
      LLM_MODEL: ${LLM_MODEL:-unset}
      LLM_API_KEY: ${LLM_API_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}
    ports:
      - "127.0.0.1:8010:8010"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - platform

  # ── Prometheus ─────────────────────────────────────────────
  # Scrapes api:8010/metrics — that endpoint existed unused for a while before
  # anything actually collected it. See docs/decisions.md ADR-021.
  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - platform

  # ── Grafana ────────────────────────────────────────────────
  # Datasource and one dashboard are provisioned from disk (docker/grafana/) —
  # nothing to click through by hand after `docker compose up`.
  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - platform

networks:
  platform:
    name: enterprise-ai-platform

volumes:
  db-data:
  prometheus-data:
  grafana-data:
