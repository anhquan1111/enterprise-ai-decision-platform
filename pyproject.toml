[project]
name = "enterprise-ai-decision-platform"
version = "0.1.0"
description = "Enterprise AI assistant: routes questions to SQL or document retrieval, answers with citations under role-based access control, with an evaluated retrieval pipeline and audit logging"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "anhquan1111" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.15.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.6",
    # Ingestion và bộ eval (D2) đều xử lý dữ liệu dạng bảng; để ở dependency chính
    # thay vì extra để scripts/ chạy được ngay sau uv sync.
    "pandas>=2.2.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.26.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12",
    "pandas-stubs>=2.2.0",
]
# Installed on D2 when the eval harness lands (MLflow run tracking + BM25).
eval = [
    "mlflow>=2.17.0",
    "rank-bm25>=0.2.2",
]
# Installed on D2 only if EMBEDDING_BACKEND=local (pulls torch — large download).
embed = [
    "sentence-transformers>=3.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# A test that waits forever is a failure, not a test still running. 30s is far
# above any legitimate test here, so only a genuine hang trips it.
timeout = 30
markers = [
    "integration: needs a running PostgreSQL (skipped by default in CI lint job)",
]
